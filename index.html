<style>
  :root {
    --navy: #1c3a5e;
    --navy-dark: #142b46;
    --blue: #1f5fa3;
    --silver: #d5d9de;
    --silver-light: #f1f3f5;
    --text: #222;
    --muted: #555;
    --focus: #f2b632;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 1rem;
    line-height: 1.55;
    color: var(--text);
    background: #fff;
  }
  a { color: var(--blue); }
  a:hover { color: var(--navy-dark); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .skip-link {
    position: absolute; left: .5rem; top: -3rem;
    background: #fff; color: var(--navy); padding: .4rem .8rem; z-index: 10;
  }
  .skip-link:focus { top: .5rem; }

  .concept-banner {
    background: #fff6dc; color: #4d3800;
    font-size: .9rem; text-align: center; padding: .4rem 1rem;
    border-bottom: 1px solid #e4cf8f;
  }

  .wrap { max-width: 62rem; margin: 0 auto; padding-left: 1.25rem; padding-right: 1.25rem; }

  header { background: var(--navy); color: #fff; }
  .masthead { display: flex; align-items: center; gap: 1rem; padding-top: 1rem; padding-bottom: 1rem; }
  .seal {
    width: 96px; height: 96px; flex: 0 0 auto;
    background: #fff; border-radius: 50%; overflow: hidden;
  }
  .seal img {
    width: 100%; height: 100%; display: block;
    object-fit: contain;
    transform: translateX(.5px) scale(1.12);
  }
  .site-name {
    margin: 0; font-family: Georgia, "Times New Roman", serif;
    font-size: 1.6rem; font-weight: normal; line-height: 1.2;
  }
  .site-place { margin: .2rem 0 0; font-size: .95rem; color: #d9e3ee; }

  nav { background: var(--silver-light); border-bottom: 1px solid var(--silver); }
  nav ul {
    list-style: none; margin: 0 0 0 -.9rem; padding: 0;
    display: flex; flex-wrap: wrap;
  }
  nav a {
    display: block; padding: .65rem .9rem; color: var(--navy);
    text-decoration: none; font-size: .95rem;
  }
  nav a:hover { background: #e2e6ea; text-decoration: underline; }

  .layout { display: flex; gap: 2.5rem; padding-top: 1.5rem; padding-bottom: 2rem; }
  main { flex: 1 1 auto; min-width: 0; }
  aside { flex: 0 0 15rem; font-size: .95rem; }

  h1, h2, h3 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: normal; color: var(--navy); line-height: 1.25;
  }
  h1 { font-size: 1.75rem; margin: 0 0 .6rem; }
  h2 {
    font-size: 1.35rem; margin: 2rem 0 .5rem;
    padding-bottom: .25rem; border-bottom: 1px solid var(--silver);
  }
  h3 { font-size: 1.1rem; margin: 1.2rem 0 .3rem; }

  .events { list-style: none; padding: 0; margin: .5rem 0; }
  .events li { padding: .45rem 0; border-bottom: 1px dotted var(--silver); }
  .events .date { display: inline-block; min-width: 7.5rem; font-weight: bold; color: var(--navy); }

  table { width: 100%; border-collapse: collapse; margin: .5rem 0; font-size: .95rem; }
  caption { text-align: left; color: var(--muted); padding-bottom: .3rem; }
  th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--silver); }
  th { color: var(--navy); font-weight: bold; }

  aside h2 { font-size: 1.1rem; margin-top: 0; }
  aside section + section h2 { margin-top: 1.5rem; }
  aside p { margin: .3rem 0; }

  footer { background: var(--navy-dark); color: #e6ecf2; font-size: .9rem; }
  footer .wrap { padding-top: 1rem; padding-bottom: 1.2rem; }
  footer a { color: #ffffff; }

  /* Example idea form */
  .demo-form {
    max-width: 36rem;
    margin: 1rem 0 1.5rem;
    padding: 1.25rem 1.5rem 1.5rem;
    background: var(--silver-light);
    border: 1px solid #8a9099;
    border-top: 4px solid var(--navy);
  }
  .demo-form .form-note {
    margin: 0 0 1rem; font-size: .875rem; font-style: italic; color: var(--muted);
  }
  .demo-form .field { margin: 0 0 1.1rem; padding: 0; border: 0; }
  .demo-form .field > label,
  .demo-form legend {
    display: block; margin: 0 0 .3rem; padding: 0;
    font-weight: bold; color: var(--text);
  }
  .demo-form .optional { font-weight: normal; color: var(--muted); }
  .demo-form .help { margin: .3rem 0 0; font-size: .875rem; color: var(--muted); }
  .demo-form input[type="text"],
  .demo-form select,
  .demo-form textarea {
    display: block; width: 100%;
    font: inherit; padding: .55rem .6rem;
    background: #fff; border: 1px solid #6b727b; border-radius: 0;
  }
  .demo-form textarea { min-height: 8rem; resize: vertical; }
  .demo-form .inline {
    display: inline-flex; align-items: center; gap: .4rem;
    margin: 0 1.25rem .3rem 0; font-weight: normal;
  }
  .demo-form button {
    font: inherit; font-weight: bold;
    background: var(--navy); color: #fff;
    border: 0; padding: .65rem 1.4rem; cursor: pointer;
  }
  .demo-form button:hover { background: var(--navy-dark); }
  .demo-form .form-status { margin: .75rem 0 0; font-weight: bold; color: var(--navy); }

  /* Phones and small screens */
  @media (max-width: 44rem) {
    .wrap { padding-left: 1rem; padding-right: 1rem; }
    .masthead { gap: .85rem; padding-top: .85rem; padding-bottom: .85rem; }
    .seal { width: 64px; height: 64px; }
    .site-name { font-size: 1.25rem; }
    .site-place { font-size: .85rem; }

    nav ul { margin-left: -.6rem; }
    nav a { padding: .55rem .6rem; font-size: .9rem; }

    .layout { flex-direction: column; gap: 1.5rem; padding-top: 1.25rem; padding-bottom: 1.5rem; }
    aside { flex-basis: auto; border-top: 1px solid var(--silver); padding-top: 1.25rem; }

    h1 { font-size: 1.45rem; }
    h2 { font-size: 1.2rem; margin-top: 1.75rem; }

    .events .date { display: block; min-width: 0; }

    .demo-form { padding: 1rem; }
    .demo-form .inline { display: flex; margin-right: 0; margin-bottom: .4rem; }

    table { font-size: .9rem; }
    th, td { padding: .4rem .35rem; }
  }
</style>
